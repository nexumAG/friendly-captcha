name: Publish to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@nexumag"

      # The version in package.json is the source of truth. Make sure the
      # release tag matches it, and derive the npm dist-tag from it (a prerelease
      # like `1.0.0-beta.1` publishes under `beta`, a stable `1.0.0` under `latest`).
      - name: Check tag matches version and pick dist-tag
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::Release tag '$tag_version' does not match package.json version '$pkg_version'."
            exit 1
          fi
          if [[ "$pkg_version" == *-* ]]; then
            label="${pkg_version#*-}"
            echo "DIST_TAG=${label%%.*}" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
