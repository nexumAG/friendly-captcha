name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # The version in package.json is the source of truth. Make sure the
      # release tag matches it, and derive the npm dist-tag from it (a prerelease
      # like `1.0.0-beta.1` publishes under `beta`, a stable `1.0.0` under `latest`).
      - name: Check tag matches version and pick dist-tag
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::Release tag '$tag_version' does not match package.json version '$pkg_version'."
            exit 1
          fi
          if [[ "$pkg_version" == *-* ]]; then
            label="${pkg_version#*-}"
            echo "DIST_TAG=${label%%.*}" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Install dependencies
        run: npm ci

      # Builds, then guards the published shape: entry points resolve, and types
      # resolve under node16/nodenext.
      - name: Build and verify package
        run: npm run check:pkg

      # No NODE_AUTH_TOKEN: npm >= 11.5.1 (Node 24 ships 11.16) authenticates via
      # the OIDC token above, which also produces a provenance attestation.
      # Requires a trusted publisher for this repo + `publish.yml` to be configured
      # under Settings -> Trusted publishing on npmjs.com. Renaming this file breaks
      # publishing until the trusted publisher is updated to match.
      - name: Publish
        run: npm publish --tag "$DIST_TAG"
